# @kakoyo plugin bundle patch, applied as one insert over the profile's
# composition when this package is added via `dsh plugin --profile <name> add
# @kakoyo/dsh-kakoyo`.
#
# Each row references a package this bundle depends on. The last write per row
# wins, so you can override a row's config in your profile `cordis.patch.yml`.

- insert:
    - id: kakoyo-clock
      name: '@kakoyo/dsh-clock'

    - id: kakoyo-system-prompt
      name: '@kakoyo/dsh-system-prompt'

    - id: kakoyo-settings
      name: '@kakoyo/dsh-kakoyo'
